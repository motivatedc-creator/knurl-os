# Railway config-as-code for Knurl OS.
# Builds a Nitro Node server. The Grok/Vercel pipeline ignores this file.

[build]
builder = "RAILPACK"
buildCommand = "NITRO_PRESET=node-server npm run build"

[deploy]
startCommand = "HOST=:: node .output/server/index.mjs"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
